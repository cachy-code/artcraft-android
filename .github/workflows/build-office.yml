name: Build Office APKs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      source_version:
        description: 'Upstream source version'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        app:
          - wordcraft
          - deckcraft
          - gridcraft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --upgrade pillow

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.9.0

      - name: Cache sccache compiler artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.app }}-
            sccache-${{ runner.os }}-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure JDK for build script
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-
            gradle-${{ runner.os }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ matrix.app }}-
            cargo-registry-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
            chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          fi
          cargo ndk -V

      - name: Configure Android SDK and NDK
        run: |
          echo "ARTCRAFT_TARGET_SDK=30" >> "$GITHUB_ENV"
          echo "ARTCRAFT_BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              echo "ANDROID_NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
              echo "NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build ${{ matrix.app }} APK
        timeout-minutes: 35
        env:
          BUILD_MODE: ${{ inputs.mode || 'release' }}
          BUILD_SOURCE: ${{ inputs.source_version || 'stable' }}
          RUSTC_WRAPPER: sccache
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
        run: |
          mkdir -p logs output
          rm -f output/*.apk output/*.tmp
          set -o pipefail
          BUILD_LOG="logs/${{ matrix.app }}-build.log"
          if [ "$BUILD_MODE" = "debug" ]; then
            bash build-debug.sh -${{ matrix.app }} 2>&1 | tee "$BUILD_LOG"
          else
            bash build.sh -${{ matrix.app }} 2>&1 | tee "$BUILD_LOG"
          fi
          sccache --show-stats || true

      - name: Verify built APK integrity
        run: |
          count=0
          for apk in output/*.apk; do
            [ -f "$apk" ] || continue
            count=$((count + 1))
            size=$(stat -c%s "$apk" 2>/dev/null || echo 0)
            if [ "$size" -lt 1000000 ]; then
              echo "::error::APK $apk is empty or too small ($size bytes)" | tee -a "logs/${{ matrix.app }}-build.log" >&2
              exit 1
            fi
            if ! unzip -tq "$apk" >/dev/null 2>&1; then
              echo "::error::APK $apk is corrupted" | tee -a "logs/${{ matrix.app }}-build.log" >&2
              exit 1
            fi
            echo "Verified valid APK: $apk ($((size / 1048576)) MB)"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK found in output/" | tee -a "logs/${{ matrix.app }}-build.log" >&2
            exit 1
          fi

      - name: Upload ${{ matrix.app }} APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare build logs on failure
        if: failure()
        run: |
          mkdir -p logs
          if [ -z "$(find logs -maxdepth 1 -type f -name '*.log' 2>/dev/null)" ]; then
            echo "Build failed for ${{ matrix.app }} before log output could be written." > "logs/${{ matrix.app }}-build.log"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-log
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: Bundle Office APKs
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download office APK artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: office-apks
          pattern: '*-apk'
          merge-multiple: true

      - name: Validate APKs
        id: check_apks
        run: |
          mkdir -p office-apks
          count=0
          for apk in office-apks/*.apk; do
            [ -f "$apk" ] || continue
            if unzip -tq "$apk" >/dev/null 2>&1; then
              count=$((count + 1))
              echo "Valid APK: $apk"
            else
              echo "Invalid APK: $apk"
              rm -f "$apk"
            fi
          done
          if [ "$count" -gt 0 ]; then
            echo "has_apks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined Office APK artifact
        if: steps.check_apks.outputs.has_apks == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-office-apks
          path: office-apks/*.apk
          retention-days: 14

      - name: Download failed build logs
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: office-build-logs
          pattern: '*-build-log'
          merge-multiple: true

      - name: Upload combined build logs
        if: hashFiles('office-build-logs/*.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: office-build-logs
          path: office-build-logs/*.log
          retention-days: 14

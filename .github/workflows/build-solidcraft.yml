name: Build SolidCraft APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "APK build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      source_version:
        description: "SolidCraft upstream source"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - main

permissions:
  contents: read

concurrency:
  group: solidcraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-solidcraft:
    name: Build SolidCraft (ARMv7)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Check out ArtCraft builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure JDK path for the build script
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Set up Rust for ARMv7
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.9.0

      - name: Cache Rust compiler artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: solidcraft-sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            solidcraft-sccache-${{ runner.os }}-

      - name: Cache Cargo and Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: solidcraft-deps-${{ runner.os }}-${{ hashFiles('lib/build-common.sh') }}
          restore-keys: |
            solidcraft-deps-${{ runner.os }}-

      - name: Install Android SDK 33, Build Tools 35 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools"
          {
            echo "ARTCRAFT_TARGET_SDK=33"
            echo "ARTCRAFT_BUILD_TOOLS_VERSION=35.0.0"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk -V

      - name: Build SolidCraft APK
        env:
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_SOURCE: ${{ inputs.source_version }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: |
          mkdir -p logs output
          set -o pipefail
          if [ "$BUILD_MODE" = "debug" ]; then
            bash build-debug.sh -solidcraft 2>&1 | tee logs/solidcraft-build.log
          else
            bash build.sh -solidcraft 2>&1 | tee logs/solidcraft-build.log
          fi
          sccache --show-stats || true

      - name: Verify APK
        run: |
          count=0
          for apk in output/*solidcraft*.apk; do
            [ -f "$apk" ] || continue
            count=$((count + 1))
            size=$(stat -c%s "$apk")
            if [ "$size" -lt 1000000 ] || ! unzip -tq "$apk" >/dev/null 2>&1; then
              echo "::error::APK is empty, too small, or corrupt: $apk ($size bytes)"
              exit 1
            fi
            echo "Verified $apk ($((size / 1048576)) MiB)"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No SolidCraft APK found in output/"
            exit 1
          fi

      - name: Upload SolidCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-${{ inputs.mode }}-armv7-apk
          path: output/*solidcraft*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-build-log
          path: logs/solidcraft-build.log
          if-no-files-found: ignore
          retention-days: 14
